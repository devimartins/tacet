# Alerta de vencimento do domínio: roda toda segunda-feira. Se faltarem menos de 45 dias, o job falha
# e o GitHub envia e-mail ao dono do repositório. Também falha se o site não responder.
name: Verificar domínio e site
on:
  schedule: [{ cron: '17 9 * * 1' }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Site no ar
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://forjaclip.com.br/)
          echo "HTTP $code"; [ "$code" = "200" ] || { echo "::error::O site respondeu $code"; exit 1; }
      - name: Vencimento do domínio (RDAP do Registro.br)
        run: |
          json=$(curl -s https://rdap.registro.br/domain/forjaclip.com.br || true)
          exp=$(echo "$json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((e['eventDate'] for e in d.get('events',[]) if e.get('eventAction')=='expiration'),''))" 2>/dev/null || true)
          if [ -z "$exp" ]; then echo "::warning::Não consegui ler a data de vencimento no RDAP."; exit 0; fi
          days=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
          echo "Vence em $exp ($days dias)"
          [ "$days" -gt 45 ] || { echo "::error::O domínio forjaclip.com.br vence em $days dias ($exp). Renove no Registro.br."; exit 1; }
